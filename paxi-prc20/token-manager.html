<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRC-20 Token Manager (Stateless)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://mainnet-api.paxinet.io/resources/js/paxi-cosmjs.umd.js"></script>
  <style>
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .tab-active { background: rgba(139, 92, 246, 0.3); border-bottom: 2px solid #8b5cf6; }
    input, textarea { background: rgba(0,0,0,0.5) !important; border: 1px solid rgba(255,255,255,0.2) !important; color: white; }
  </style>
</head>
<body class="bg-black text-white min-h-screen">
  
  <div class="container mx-auto px-4 py-8 max-w-6xl">
    <header class="glass rounded-2xl p-8 mb-8">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-3xl font-bold mb-2">PRC-20 Manager v1.0.0</h1>
          <p class="text-gray-400 text-sm">Decentralized Token Control Center</p>
        </div>
        <button onclick="connectWallet()" id="connectBtn" class="bg-purple-600 px-6 py-3 rounded-lg hover:bg-purple-700 transition">
          <i class="fas fa-wallet mr-2"></i>Connect Wallet
        </button>
      </div>
      <div id="walletInfo" class="hidden mt-4 pt-4 border-t border-white/10">
        <p class="font-mono text-xs text-purple-400" id="walletAddress"></p>
      </div>
    </header>

    <div id="mainContent" class="hidden space-y-6">
      <div class="glass rounded-xl p-6">
        <h2 class="text-xl font-semibold mb-4">Manage by Contract Address</h2>
        <div class="flex gap-2">
          <input type="text" id="manualContract" placeholder="paxi1..." class="flex-1 rounded-lg px-4 py-2">
          <button onclick="accessManualToken()" class="bg-white/10 px-6 py-2 rounded-lg hover:bg-white/20 transition">Manage</button>
        </div>
      </div>

      <div class="glass rounded-xl p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-semibold">Your Created Tokens</h2>
          <span class="text-xs text-gray-500">(Saved locally)</span>
        </div>
        <div id="tokenList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          </div>
      </div>
    </div>

    <div id="actionModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center z-50 p-4">
      <div class="glass rounded-2xl p-6 max-w-xl w-full max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-xl font-bold" id="modalTokenName">Token Manager</h3>
          <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
        </div>

        <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
          <button onclick="switchTab('mint')" class="tab-btn px-4 py-2 rounded-lg whitespace-nowrap" data-tab="mint">Mint</button>
          <button onclick="switchTab('burn')" class="tab-btn px-4 py-2 rounded-lg whitespace-nowrap" data-tab="burn">Burn</button>
          <button onclick="switchTab('renounce')" class="tab-btn px-4 py-2 rounded-lg whitespace-nowrap" data-tab="renounce">Renounce</button>
          <button onclick="switchTab('metadata')" class="tab-btn px-4 py-2 rounded-lg whitespace-nowrap" data-tab="metadata">Metadata</button>
        </div>

        <div id="tabContent" class="space-y-4">
          <div id="tab-mint" class="tab-content hidden space-y-4">
            <input type="text" id="mintRecipient" placeholder="Recipient Address (paxi1...)" class="w-full rounded-lg px-4 py-3">
            <input type="number" id="mintAmount" placeholder="Amount to Mint" class="w-full rounded-lg px-4 py-3">
            <button onclick="executeAction('mint')" class="w-full bg-green-600 py-3 rounded-lg font-bold">Execute Mint (1 PAXI)</button>
          </div>

          <div id="tab-burn" class="tab-content hidden space-y-4">
            <input type="number" id="burnAmount" placeholder="Amount to Burn" class="w-full rounded-lg px-4 py-3">
            <button onclick="executeAction('burn')" class="w-full bg-orange-600 py-3 rounded-lg font-bold">Execute Burn (1 PAXI)</button>
          </div>

          <div id="tab-renounce" class="tab-content hidden space-y-4 text-center">
            <div class="p-4 bg-red-900/20 border border-red-500/50 rounded-lg text-red-400 text-sm">
              WARNING: This will lock supply forever. You can NEVER mint again.
            </div>
            <label class="flex items-center justify-center gap-2 cursor-pointer">
              <input type="checkbox" id="confirmRenounce"> <span>I am sure</span>
            </label>
            <button onclick="executeAction('renounce')" class="w-full bg-red-600 py-3 rounded-lg font-bold">Renounce Minter (1 PAXI)</button>
          </div>

          <div id="tab-metadata" class="tab-content hidden space-y-3">
            <input type="text" id="metaProject" placeholder="Project Name" class="w-full rounded-lg px-4 py-2">
            <textarea id="metaDescription" placeholder="Description" class="w-full rounded-lg px-4 py-2"></textarea>
            <input type="text" id="metaLogo" placeholder="Logo URL" class="w-full rounded-lg px-4 py-2">
            <button onclick="executeAction('metadata')" class="w-full bg-blue-600 py-3 rounded-lg font-bold">Update Metadata (1 PAXI)</button>
          </div>
        </div>
      </div>
    </div>

    <div id="processingModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[60]">
      <div class="text-center"><i class="fas fa-spinner fa-spin text-4xl text-purple-500 mb-4"></i><p id="procText">Processing...</p></div>
    </div>

    <div id="successModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[60] p-4">
      <div class="glass p-8 rounded-2xl text-center max-w-sm w-full">
        <i class="fas fa-check-circle text-5xl text-green-500 mb-4"></i>
        <h3 class="text-xl font-bold mb-2">Action Success!</h3>
        <p id="successText" class="text-sm text-gray-400 mb-6"></p>
        <button onclick="location.reload()" class="w-full bg-white text-black py-2 rounded-lg font-bold">Done</button>
      </div>
    </div>

  </div>
<script>
  const BACKEND_URL = "https://paxihub-prc20-production.up.railway.app";
  const SERVICE_ADDRESS = "paxi153swt0m7nlld2wlptzgquhedvge4jtgx6m549t";
  const LCD = "https://mainnet-lcd.paxinet.io";
  const RPC = "https://mainnet-rpc.paxinet.io";
  const DENOM = "upaxi";
  
  let userAddress = "";
  let chainId = "paxi-1"; // Default chainId
  let currentToken = null;

  // Load Initial Data
  window.addEventListener('load', async () => {
    try {
      const statusRes = await fetch(`${RPC}/status`);
      const statusData = await statusRes.json();
      chainId = statusData.result.node_info.network;
    } catch (e) {
      console.error('Failed to fetch chainId:', e);
    }
  });

  async function connectWallet() {
    if (!window.paxihub) return alert("Please open in PaxiHub app");
    try {
      const addr = await window.paxihub.paxi.getAddress();
      userAddress = addr.address;
      document.getElementById('walletAddress').textContent = userAddress;
      document.getElementById('walletInfo').classList.remove('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
      document.getElementById('connectBtn').innerHTML = '<i class="fas fa-check mr-2"></i>Connected';
      document.getElementById('connectBtn').disabled = true;
      loadLocalTokens();
    } catch (err) {
      alert("Connect error: " + err.message);
    }
  }

  function loadLocalTokens() {
    const tokens = JSON.parse(localStorage.getItem(`tokens_${userAddress}`) || "[]");
    const container = document.getElementById('tokenList');
    if (tokens.length === 0) {
      container.innerHTML = '<p class="text-gray-500 col-span-full text-center py-4">No tokens found in local storage.</p>';
      return;
    }
    container.innerHTML = tokens.map(t => `
      <div class="glass p-4 rounded-xl flex justify-between items-center hover:bg-white/5 transition">
        <div>
          <p class="font-bold text-purple-400">${t.symbol}</p>
          <p class="text-[10px] text-gray-500 font-mono">${t.address}</p>
        </div>
        <button onclick="accessManualToken('${t.address}')" class="text-xs bg-purple-600 px-3 py-1 rounded-lg hover:bg-purple-700">Manage</button>
      </div>
    `).join('');
  }

  async function accessManualToken(addr) {
    const contract = addr || document.getElementById('manualContract').value.trim();
    if (!contract.startsWith('paxi1')) return alert("Invalid Paxi Address");
    
    showProc("Fetching Contract Info...");
    try {
      const query = btoa(JSON.stringify({ token_info: {} }));
      const res = await fetch(`${LCD}/cosmwasm/wasm/v1/contract/${contract}/smart/${query}`);
      const info = await res.json();
      
      if (!info.data) throw new Error("Contract info not found or not a CW20");
      
      currentToken = {
        address: contract,
        name: info.data.name,
        symbol: info.data.symbol,
        decimals: info.data.decimals
      };

      // Save to local storage for persistence
      const local = JSON.parse(localStorage.getItem(`tokens_${userAddress}`) || "[]");
      if (!local.find(x => x.address === contract)) {
        local.push({ address: contract, symbol: info.data.symbol });
        localStorage.setItem(`tokens_${userAddress}`, JSON.stringify(local));
        loadLocalTokens();
      }

      document.getElementById('modalTokenName').textContent = `${info.data.name} (${info.data.symbol})`;
      hideProc();
      document.getElementById('actionModal').classList.remove('hidden');
      switchTab('mint');
    } catch (e) {
      hideProc();
      alert("Error: " + e.message);
    }
  }

  async function executeAction(action) {
    if (action === 'renounce' && !document.getElementById('confirmRenounce').checked) {
      return alert("Please check the confirmation box");
    }
    
    let actionData = {};
    if (action === 'mint') {
      actionData = { 
        recipient: document.getElementById('mintRecipient').value, 
        amount: document.getElementById('mintAmount').value 
      };
      if(!actionData.recipient || !actionData.amount) return alert("Fill all fields");
    }
    if (action === 'burn') {
      actionData = { amount: document.getElementById('burnAmount').value };
      if(!actionData.amount) return alert("Enter amount");
    }
    if (action === 'metadata') {
      actionData = { 
        projectName: document.getElementById('metaProject').value, 
        description: document.getElementById('metaDescription').value, 
        logo: document.getElementById('metaLogo').value 
      };
    }

    try {
      showProc("Preparing Payment (1 PAXI)...");
      
      // BUILD TRANSACTION
      const msg = PaxiCosmJS.MsgSend.fromPartial({
        fromAddress: userAddress,
        toAddress: SERVICE_ADDRESS,
        amount: [PaxiCosmJS.coins("1000000", DENOM)[0]]
      });
      
      const anyMsg = PaxiCosmJS.Any.fromPartial({
        typeUrl: "/cosmos.bank.v1beta1.MsgSend",
        value: PaxiCosmJS.MsgSend.encode(msg).finish()
      });

      showProc("Waiting for approval...");
      const txHash = await buildAndSendTx([anyMsg], `Action: ${action}`);
      
      showProc("Verifying with Backend...");
      const res = await fetch(`${BACKEND_URL}/api/manage-token`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          userAddress, 
          txHash, 
          contractAddress: currentToken.address, 
          action, 
          actionData: { ...actionData, decimals: currentToken.decimals }
        })
      });
      
      const result = await res.json();
      if (!result.success) throw new Error(result.error);
      
      hideProc();
      document.getElementById('successText').textContent = `Success! Action ${action} has been broadcasted to Paxi Network.`;
      document.getElementById('successModal').classList.remove('hidden');
      closeModal();
    } catch (e) {
      hideProc();
      alert("Execution Failed: " + e.message);
    }
  }

  // --- CORE TRANSACTION ENGINE ---
  async function buildAndSendTx(messages, memo = "") {
    const { accountNumber, sequence } = await buildCommon(userAddress);
    const txBody = PaxiCosmJS.TxBody.fromPartial({ messages, memo });
    const fee = {
      amount: [PaxiCosmJS.coins("25000", DENOM)[0]],
      gasLimit: 500_000
    };
    
    const addressInfo = await window.paxihub.paxi.getAddress();
    const pubkeyBytes = new Uint8Array(addressInfo.public_key);
    const pubkeyAny = {
      typeUrl: "/cosmos.crypto.secp256k1.PubKey",
      value: PaxiCosmJS.PubKey.encode({ key: pubkeyBytes }).finish()
    };
    
    const authInfo = PaxiCosmJS.AuthInfo.fromPartial({
      signerInfos: [{
        publicKey: pubkeyAny,
        modeInfo: { single: { mode: 1 } },
        sequence: BigInt(sequence)
      }],
      fee
    });
    
    const signDoc = PaxiCosmJS.SignDoc.fromPartial({
      bodyBytes: PaxiCosmJS.TxBody.encode(txBody).finish(),
      authInfoBytes: PaxiCosmJS.AuthInfo.encode(authInfo).finish(),
      chainId,
      accountNumber: BigInt(accountNumber)
    });
    
    const txObj = {
      bodyBytes: btoa(String.fromCharCode(...signDoc.bodyBytes)),
      authInfoBytes: btoa(String.fromCharCode(...signDoc.authInfoBytes)),
      chainId,
      accountNumber: signDoc.accountNumber.toString()
    };
    
    const result = await window.paxihub.paxi.signAndSendTransaction(txObj);
    if (!result.success) throw new Error('User rejected or signing failed');
    
    const sigBytes = Uint8Array.from(atob(result.success), c => c.charCodeAt(0));
    const txRaw = PaxiCosmJS.TxRaw.fromPartial({
      bodyBytes: signDoc.bodyBytes,
      authInfoBytes: signDoc.authInfoBytes,
      signatures: [sigBytes]
    });
    
    const txBytes = PaxiCosmJS.TxRaw.encode(txRaw).finish();
    const base64Tx = btoa(String.fromCharCode(...txBytes));
    
    const broadcastResult = await fetch(`${LCD}/cosmos/tx/v1beta1/txs`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tx_bytes: base64Tx, mode: "BROADCAST_MODE_SYNC" })
    }).then(r => r.json());
    
    if (broadcastResult.tx_response && broadcastResult.tx_response.code === 0) {
      return broadcastResult.tx_response.txhash;
    } else {
      throw new Error(broadcastResult.tx_response?.raw_log || 'Broadcast failed');
    }
  }

  async function buildCommon(address) {
    const res = await fetch(`${LCD}/cosmos/auth/v1beta1/accounts/${address}`);
    const data = await res.json();
    const account = data.account.base_account || data.account;
    return {
      accountNumber: Number(account.account_number),
      sequence: Number(account.sequence)
    };
  }

  // --- UI HELPERS ---
  function switchTab(t) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    document.querySelector(`[data-tab="${t}"]`).classList.add('tab-active');
    document.getElementById(`tab-${t}`).classList.remove('hidden');
  }

  function showProc(t) { 
    document.getElementById('procText').textContent = t; 
    document.getElementById('processingModal').classList.remove('hidden'); 
  }
  
  function hideProc() { 
    document.getElementById('processingModal').classList.add('hidden'); 
  }
  
  function closeModal() { 
    document.getElementById('actionModal').classList.add('hidden'); 
    currentToken = null;
  }
</script>

</body>
</html>
