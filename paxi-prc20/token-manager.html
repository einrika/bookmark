<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRC-20 Ultimate Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://mainnet-api.paxinet.io/resources/js/paxi-cosmjs.umd.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap');
    body { font-family: 'Inter', sans-serif; background: #050505; color: white; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .tab-active { background: #8b5cf6 !important; color: white !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    input, textarea { background: rgba(0,0,0,0.4) !important; color: white !important; }
  </style>
</head>

<body class="min-h-screen pb-10">
  <div class="container mx-auto px-4 py-4 max-w-xl">
    
    <header class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-blue-400 bg-clip-text text-transparent">PRC-20 Pro</h1>
        <p class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Manager Mode</p>
      </div>
      <button onclick="connectWallet()" id="connectBtn" class="glass px-4 py-2 rounded-xl text-sm font-bold border-purple-500/30 active:scale-95 transition">
        <i class="fas fa-wallet mr-2 text-purple-400"></i>Connect
      </button>
    </header>

    <div id="walletInfo" class="hidden glass rounded-2xl p-4 mb-6 border-l-4 border-l-purple-500 flex justify-between items-center">
      <div>
        <p class="text-[10px] text-gray-500 uppercase font-bold tracking-tight">Wallet Connected</p>
        <p class="text-sm font-mono text-purple-200" id="walletAddressDisplay"></p>
      </div>
      <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
    </div>

    <main id="mainContent" class="hidden space-y-6">
      <section>
        <div class="flex justify-between items-end mb-4 px-1">
          <h2 class="text-lg font-bold">Assets</h2>
          <div class="flex gap-3">
            <button onclick="showAddTokenModal()" class="text-blue-400 text-xs font-bold uppercase"><i class="fas fa-plus-circle mr-1"></i>Import</button>
            <button onclick="refreshTokens()" class="text-gray-500 text-xs font-bold uppercase"><i class="fas fa-sync-alt"></i></button>
          </div>
        </div>
        <div id="tokenList" class="grid gap-3"></div>
      </section>
    </main>

    <div id="actionModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex flex-col justify-end">
      <div class="glass w-full max-w-xl mx-auto rounded-t-[2.5rem] p-6 overflow-y-auto max-h-[90vh]">
        
        <div class="flex justify-between items-center mb-6">
          <div class="flex items-center gap-3">
            <div id="modalIcon" class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 to-blue-600 flex items-center justify-center font-bold text-lg">TK</div>
            <div>
              <h3 id="modalTokenName" class="font-bold text-lg leading-tight">--</h3>
              <p id="modalTokenContract" class="text-[10px] font-mono text-gray-500"></p>
            </div>
          </div>
          <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center"><i class="fas fa-times"></i></button>
        </div>

        <div class="flex gap-2 overflow-x-auto no-scrollbar mb-6 border-b border-white/5 pb-2">
          <button onclick="switchTab('mint')" class="tab-btn px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap bg-white/5 text-gray-400" data-tab="mint">MINT</button>
          <button onclick="switchTab('metadata')" class="tab-btn px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap bg-white/5 text-gray-400" data-tab="metadata">METADATA / LOGO</button>
          <button onclick="switchTab('security')" class="tab-btn px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap bg-white/5 text-gray-400" data-tab="security">SECURITY</button>
          <button onclick="switchTab('burn')" class="tab-btn px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap bg-white/5 text-gray-400" data-tab="burn">BURN</button>
        </div>

        <div id="tabContent">
          <div id="tab-mint" class="tab-content space-y-4">
            <input type="number" id="mintAmount" placeholder="Amount" class="w-full border border-white/10 rounded-2xl px-5 py-4 outline-none focus:border-purple-500">
            <input type="text" id="mintRecipient" placeholder="Recipient address" class="w-full border border-white/10 rounded-2xl px-5 py-4 outline-none focus:border-purple-500">
            <button onclick="executeMint()" class="w-full bg-white text-black py-4 rounded-2xl font-bold">Mint Tokens</button>
          </div>

          <div id="tab-metadata" class="tab-content hidden space-y-4">
            <input type="text" id="metaProject" placeholder="New Project Name" class="w-full border border-white/10 rounded-xl px-4 py-3 outline-none">
            <input type="text" id="metaLogo" placeholder="New Logo URL (https://...)" class="w-full border border-white/10 rounded-xl px-4 py-3 outline-none">
            <textarea id="metaDescription" placeholder="Description" rows="3" class="w-full border border-white/10 rounded-xl px-4 py-3 outline-none"></textarea>
            <button onclick="executeMetadata()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold">Save Info & Logo</button>
          </div>

          <div id="tab-security" class="tab-content hidden space-y-4">
            <div class="bg-red-500/10 border border-red-500/20 p-4 rounded-2xl">
              <h4 class="text-red-400 font-bold text-sm mb-1">MENCABUT IZIN MENCETAK</h4>
              <p class="text-[11px] text-gray-400 leading-relaxed">Status: <b>Minter aktif</b>. Jika Anda menekan tombol di bawah, izin mencetak akan dicabut selamanya (Renounce). Token Anda akan menjadi Fixed Supply.</p>
            </div>
            <button onclick="executeRenounce()" class="w-full bg-red-600/20 border border-red-500/40 text-red-500 py-4 rounded-2xl font-bold active:scale-95 transition">RENOUNCE MINTING RIGHTS</button>
          </div>

          <div id="tab-burn" class="tab-content hidden space-y-4 text-center">
             <p class="text-[10px] text-gray-500 uppercase font-bold">Your Balance</p>
             <p id="userBalance" class="text-2xl font-bold text-red-400">0.00</p>
             <input type="number" id="burnAmount" placeholder="Amount to destroy" class="w-full border border-white/10 rounded-2xl px-5 py-4 outline-none text-center font-bold">
             <button onclick="executeBurn()" class="w-full bg-red-600 py-4 rounded-2xl font-bold">Burn Permanently</button>
          </div>
        </div>
      </div>
    </div>

    <div id="processingModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md z-[60] flex items-center justify-center p-6 text-center">
      <div>
        <div class="w-16 h-16 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <p id="processingText" class="text-sm font-bold text-gray-300">Broadcasting...</p>
      </div>
    </div>

  </div>

  <script>
    const RPC = 'https://mainnet-rpc.paxinet.io';
    const LCD = 'https://mainnet-lcd.paxinet.io';
    const DENOM = 'upaxi';
    let userAddress = '', chainId = '', currentToken = null, userTokens = [];

    // FUNGSI SHORT ADDRESS
    const shortAddr = (a) => a ? `${a.substring(0, 8)}...${a.substring(a.length - 4)}` : '...';

    async function connectWallet() {
      if (typeof window.paxihub === 'undefined') return alert('Open in PaxiHub Browser');
      try {
        const info = await window.paxihub.paxi.getAddress();
        userAddress = info.address;
        document.getElementById('walletAddressDisplay').textContent = shortAddr(userAddress);
        document.getElementById('walletInfo').classList.remove('hidden');
        document.getElementById('connectBtn').innerHTML = '<i class="fas fa-check text-green-500"></i> Connected';
        document.getElementById('mainContent').classList.remove('hidden');
        
        const res = await fetch(`${RPC}/status`).then(r=>r.json());
        chainId = res.result.node_info.network;
        refreshTokens();
      } catch (e) { alert('Connect Failed'); }
    }

    async function refreshTokens() {
      const listEl = document.getElementById('tokenList');
      listEl.innerHTML = '<p class="text-center py-10 text-xs text-gray-500">Syncing Assets...</p>';
      try {
        let addrs = JSON.parse(localStorage.getItem(`paxi_tokens_${userAddress}`) || "[]");
        const enriched = [];
        for (const addr of addrs) {
          try {
            const q = btoa(JSON.stringify({ token_info: {} }));
            const res = await fetch(`${LCD}/cosmwasm/wasm/v1/contract/${addr}/smart/${q}`).then(r=>r.json());
            if(res.data) enriched.push({ contractAddress: addr, ...res.data });
          } catch(e) {}
        }
        userTokens = enriched;
        renderTokenList(enriched);
      } catch (e) { listEl.innerHTML = '<p class="text-center text-xs">Error loading assets.</p>'; }
    }

    function renderTokenList(tokens) {
      document.getElementById('tokenList').innerHTML = tokens.map(t => `
        <div onclick='openTokenModal("${t.contractAddress}")' class="glass rounded-2xl p-4 flex items-center justify-between border border-white/5 active:scale-[0.98] transition">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-purple-600/20 border border-purple-500/30 flex items-center justify-center font-bold text-xs text-purple-400">${t.symbol.substring(0,2)}</div>
            <div>
              <h4 class="font-bold text-sm">${t.name}</h4>
              <p class="text-[10px] font-mono text-gray-500">${shortAddr(t.contractAddress)}</p>
            </div>
          </div>
          <i class="fas fa-chevron-right text-gray-800 text-xs"></i>
        </div>`).join('');
    }

    async function openTokenModal(addr) {
      currentToken = userTokens.find(t => t.contractAddress === addr);
      document.getElementById('modalTokenName').textContent = currentToken.name;
      document.getElementById('modalTokenContract').textContent = shortAddr(addr);
      document.getElementById('actionModal').classList.remove('hidden');
      switchTab('mint');
      
      // Load balance for burn tab
      try {
        const q = btoa(JSON.stringify({ balance: { address: userAddress } }));
        const res = await fetch(`${LCD}/cosmwasm/wasm/v1/contract/${addr}/smart/${q}`).then(r=>r.json());
        const bal = (parseInt(res.data.balance) / Math.pow(10, currentToken.decimals)).toFixed(2);
        document.getElementById('userBalance').textContent = `${bal} ${currentToken.symbol}`;
      } catch(e) { document.getElementById('userBalance').textContent = "0.00"; }
    }

    // --- FULL LOGIC FUNCTIONS ---

    async function executeMetadata() {
      const prj = document.getElementById('metaProject').value;
      const logo = document.getElementById('metaLogo').value;
      const dsc = document.getElementById('metaDescription').value;
      showProcessing('Updating metadata & logo...');
      try {
        const msg = { update_marketing: { 
          project: prj || undefined, 
          description: dsc || undefined, 
          logo: logo ? { url: logo } : undefined 
        } };
        await buildAndBroadcast(currentToken.contractAddress, msg);
        alert('Update Success!');
        closeModal();
      } catch (e) { alert(e.message); } finally { hideProcessing(); }
    }

    async function executeRenounce() {
      if(!confirm("PERINGATAN! Anda akan mematikan fitur mencetak selamanya. Lanjutkan?")) return;
      showProcessing('Renouncing...');
      try {
        const msg = { update_minter: { new_minter: null } };
        await buildAndBroadcast(currentToken.contractAddress, msg);
        alert('Renounce Success! Minter has been disabled.');
        closeModal();
      } catch (e) { alert(e.message); } finally { hideProcessing(); }
    }

    async function executeMint() {
      const amt = document.getElementById('mintAmount').value;
      const rec = document.getElementById('mintRecipient').value || userAddress;
      if(!amt) return;
      showProcessing('Minting...');
      try {
        const amount = (BigInt(Math.floor(amt * Math.pow(10, currentToken.decimals)))).toString();
        await buildAndBroadcast(currentToken.contractAddress, { mint: { recipient: rec, amount } });
        alert('Mint Success!');
        closeModal();
      } catch (e) { alert(e.message); } finally { hideProcessing(); }
    }

    async function executeBurn() {
      const amt = document.getElementById('burnAmount').value;
      if(!amt) return;
      showProcessing('Burning...');
      try {
        const amount = (BigInt(Math.floor(amt * Math.pow(10, currentToken.decimals)))).toString();
        await buildAndBroadcast(currentToken.contractAddress, { burn: { amount } });
        alert('Burn Success!');
        closeModal();
      } catch (e) { alert(e.message); } finally { hideProcessing(); }
    }

    async function buildAndBroadcast(contract, msg) {
      const acc = await fetch(`${LCD}/cosmos/auth/v1beta1/accounts/${userAddress}`).then(r=>r.json());
      const ba = acc.account.base_account || acc.account;
      
      const wasmMsg = PaxiCosmJS.MsgExecuteContract.fromPartial({
        sender: userAddress, contract, 
        msg: new TextEncoder().encode(JSON.stringify(msg))
      });
      const anyMsg = PaxiCosmJS.Any.fromPartial({
        typeUrl: "/cosmwasm.wasm.v1.MsgExecuteContract",
        value: PaxiCosmJS.MsgExecuteContract.encode(wasmMsg).finish()
      });

      const txBody = PaxiCosmJS.TxBody.fromPartial({ messages: [anyMsg] });
      const addressInfo = await window.paxihub.paxi.getAddress();
      
      const authInfo = PaxiCosmJS.AuthInfo.fromPartial({
        signerInfos: [{
          publicKey: { typeUrl: "/cosmos.crypto.secp256k1.PubKey", value: PaxiCosmJS.PubKey.encode({ key: new Uint8Array(addressInfo.public_key) }).finish() },
          modeInfo: { single: { mode: 1 } },
          sequence: BigInt(ba.sequence)
        }],
        fee: { amount: [PaxiCosmJS.coins("40000", DENOM)[0]], gasLimit: 800_000 }
      });

      const signDoc = PaxiCosmJS.SignDoc.fromPartial({
        bodyBytes: PaxiCosmJS.TxBody.encode(txBody).finish(),
        authInfoBytes: PaxiCosmJS.AuthInfo.encode(authInfo).finish(),
        chainId, accountNumber: BigInt(ba.account_number)
      });

      const signRes = await window.paxihub.paxi.signAndSendTransaction({
        bodyBytes: btoa(String.fromCharCode(...signDoc.bodyBytes)),
        authInfoBytes: btoa(String.fromCharCode(...signDoc.authInfoBytes)),
        chainId, accountNumber: ba.account_number.toString()
      });

      if(!signRes.success) throw new Error('Transaction Rejected by User');
      
      const txRaw = PaxiCosmJS.TxRaw.fromPartial({
        bodyBytes: signDoc.bodyBytes, authInfoBytes: signDoc.authInfoBytes,
        signatures: [Uint8Array.from(atob(signRes.success), c => c.charCodeAt(0))]
      });
      
      const broadcast = await fetch(`${LCD}/cosmos/tx/v1beta1/txs`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tx_bytes: btoa(String.fromCharCode(...PaxiCosmJS.TxRaw.encode(txRaw).finish())), mode: "BROADCAST_MODE_SYNC" })
      }).then(r => r.json());

      if(broadcast.tx_response?.code !== 0) throw new Error(broadcast.tx_response?.raw_log || 'Tx Failed');
    }

    function switchTab(t) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('tab-active', b.dataset.tab === t));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('hidden', c.id !== `tab-${t}`));
    }
    function closeModal() { document.getElementById('actionModal').classList.add('hidden'); }
    function showProcessing(t) { document.getElementById('processingText').textContent = t; document.getElementById('processingModal').classList.remove('hidden'); }
    function hideProcessing() { document.getElementById('processingModal').classList.add('hidden'); }
    function showAddTokenModal() {
        const addr = prompt("Enter contract address (paxi1...):");
        if(addr && addr.startsWith('paxi1')) {
            let t = JSON.parse(localStorage.getItem(`paxi_tokens_${userAddress}`) || "[]");
            if(!t.includes(addr)) { t.push(addr); localStorage.setItem(`paxi_tokens_${userAddress}`, JSON.stringify(t)); refreshTokens(); }
        }
    }
  </script>
</body>
</html>
